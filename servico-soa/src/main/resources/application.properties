spring.application.name=RedeDeApoio
server.port=8085

# MySQL local. O usuario e a senha abaixo sao so de desenvolvimento (ver README);
# em outro ambiente, defina DATASOURCE_USERNAME e DATASOURCE_PASSWORD.
spring.datasource.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/rede_de_apoio?createDatabaseIfNotExist=true}
spring.datasource.username=${DATASOURCE_USERNAME:rededeapoio}
spring.datasource.password=${DATASOURCE_PASSWORD:rededeapoio}
spring.jpa.open-in-view=false

# Segredo do JWT e chave usada pela API principal (C#). Troque em producao.
api.security.token.secret=${JWT_SECRET:segredo-de-desenvolvimento-rede-de-apoio}
app.servico.chave=${CHAVE_SERVICO:chave-de-desenvolvimento-sombra-amiga}

# API principal do Sombra Amiga, consultada para confirmar o cidadao
api-principal.url=${API_PRINCIPAL_URL:http://localhost:5080}
api-principal.timeout=5s

# Fuso horario das datas dos pedidos
app.timezone=America/Sao_Paulo

# CORS: origens (front-ends) autorizadas, separadas por virgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# Swagger / SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.default-produces-media-type=application/json
