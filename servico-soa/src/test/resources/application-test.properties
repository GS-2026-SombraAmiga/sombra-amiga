# Perfil "test": banco H2 em memoria, no modo de compatibilidade com MySQL.
# As mesmas migracoes do Flyway rodam aqui, entao os testes nao dependem de um
# MySQL instalado e nao sujam o banco de desenvolvimento.
spring.datasource.url=jdbc:h2:mem:rededeapoio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
